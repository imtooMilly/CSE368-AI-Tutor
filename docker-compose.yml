version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"   # Exposes Flask API
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: